pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $host $valid_host { default 0; 127.0.0.1 1; localhost 1; }
    map $http_origin $valid_origin {
        default 0;
        '' 1;
        'http://127.0.0.1:24244' 1;
        'http://localhost:24244' 1;
    }
    map $http_origin $valid_stats_origin {
        default 0;
        '' 1;
        'http://127.0.0.1:24245' 1;
        'http://localhost:24245' 1;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        if ($valid_origin = 0) { return 403; }
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://127.0.0.1:24244 ws://localhost:24244; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        location = /stats {
            alias /opt/link-stats.html;
            default_type text/html;
        }
        location = /metrics/live.json {
            alias /run/link-metrics/live.json;
            default_type application/json;
            expires -1;
        }
        location / {
            proxy_pass http://unix:/run/opencode-ui/http.sock:;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /run/secrets/proxy-auth.conf;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            client_max_body_size 8m;
        }
    }
    server {
        listen 8081;
        server_name localhost 127.0.0.1;
        if ($valid_host = 0) { return 403; }
        if ($valid_stats_origin = 0) { return 403; }
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        location = / { return 302 /stats; }
        location = /stats {
            alias /opt/link-stats.html;
            default_type text/html;
            expires -1;
        }
        location = /metrics/live.json {
            alias /run/link-metrics/live.json;
            default_type application/json;
            expires -1;
        }
        location / { return 404; }
    }
}
