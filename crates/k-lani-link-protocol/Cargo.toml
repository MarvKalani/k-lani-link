[package]
name = "k-lani-link-protocol"
version = "1.2610.31-preview.1"
edition = "2024"
rust-version = "1.96"
publish = false
license = "BUSL-1.1"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
x25519-dalek = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
