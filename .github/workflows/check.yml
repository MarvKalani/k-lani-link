name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
env:
  # Avoid intermittent HTTP/2 framing failures from the registry/CDN path.
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '5'
jobs:
  source:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo fmt --package k-lani-link --package k-lani-link-protocol -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check -p k-lani-link-protocol --target wasm32-unknown-unknown --locked
      - name: Check the isolated carrier experiment (no Docker load tests in CI)
        env:
          CARGO_TARGET_DIR: target/mailbox-bench
        run: |
          cargo fmt --manifest-path deploy/mailbox-bench/Cargo.toml -- --check
          cargo clippy --manifest-path deploy/mailbox-bench/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path deploy/mailbox-bench/Cargo.toml --locked
      - run: python3 -B -m unittest discover -s deploy/thinkrail -p 'test_*.py'
      - run: python3 -B -m unittest discover -s deploy/opencode -p 'test_*.py'
      - run: python3 -B -m unittest discover -s deploy/desktop -p 'test_*.py'
      - name: Check the PHP relay (syntax and core behavior, no web server)
        run: |
          for file in deploy/php-relay/*.php deploy/php-relay/wordpress/*.php deploy/php-relay/standalone/*.php; do
            php -l "$file"
          done
          php deploy/php-relay/test_relay.php
      - run: python3 -B -m unittest discover -s deploy/portable -p 'test_*.py'
      - name: Check proxy-lab policy boundaries (full Docker lab runs separately)
        run: python3 -B -m unittest discover -s deploy/proxy-lab -p 'test_*.py'
      - run: python3 -B deploy/thinkrail/check-website.py
      - run: node --check website/main.js
      - run: node --test npm/k-lani-link/test/*.test.js
      - run: bash -n scripts/npm-pack.sh
      - run: node --check src/ui/app.js && node --check src/ui/chat.js && node --check src/ui/scan.js
      - run: node --check deploy/cloudflare-relay/src/index.js && node --check deploy/cloudflare-relay/tokens.js
      - run: python3 -B deploy/check-names.py
      - run: python3 -B deploy/source-bundle.py
  release-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo build --release --locked
  docker:
    name: Docker dependency checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space for CUDA builds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- deploy/basalt.Dockerfile deploy/speech/tts.Dockerfile)" ]]; then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
      - name: Validate changed Compose files and build changed Dockerfiles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: python3 -B deploy/check-docker-updates.py "$BASE_SHA" "$HEAD_SHA"
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Match rust-toolchain.toml explicitly; avoid cargo-install's implicit override warning.
      - run: cargo +1.99.1 install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo lockfiles against RustSec
        shell: bash
        run: |
          status=0
          for lockfile in Cargo.lock deploy/mailbox-bench/Cargo.lock; do
            echo "::group::$lockfile"
            cargo audit --file "$lockfile" || status=1
            echo "::endgroup::"
          done
          exit "$status"
  cloudflare:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: deploy/cloudflare-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=low
  desktop-launcher:
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the launcher and reject junctions with Windows PowerShell 5.1
        shell: powershell
        run: .\deploy\desktop\Test-Launcher.ps1
