name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Link release tag to verify
        required: true
        type: string
      publish:
        description: Publish the verified packages to npm
        default: false
        type: boolean

permissions: {}
concurrency:
  group: npm-publish
  queue: max

env:
  NPM_VERSION: '11.21.2'

jobs:
  prepare:
    name: Verify release and pack
    if: github.repository == 'MarvKalani/k-lani-link' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag and its CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! $RELEASE_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo 'Expected a Link release tag such as v1.2611.17'
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            test "$commit" = "$GITHUB_SHA"
          fi
          cargo_version=$(git show "$commit:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
          test "$version" = "$cargo_version"

          preview=false
          channel=latest
          if [[ $version == *-* ]]; then
            preview=true
            channel=next
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,publishedAt |
            jq -e --argjson preview "$preview" '.isDraft == false and .isPrerelease == $preview and .publishedAt != null' >/dev/null

          # A main dispatch of Portable builds can finish before the tag is published.
          deadline=$((SECONDS + 2700))
          for workflow in check.yml portable.yml; do
            echo "Waiting for $workflow to pass on $commit"
            while :; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$commit" \
                --status success --limit 50 --json headSha,headBranch,event,url)
              passed=$(jq -r --arg commit "$commit" --arg tag "$RELEASE_TAG" '
                first(.[] | select(.headSha == $commit and
                  ((.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch")) or
                   (.headBranch == $tag and .event == "push"))) | .url) // empty' <<<"$runs")
              if [[ -n $passed ]]; then
                echo "$workflow passed ($passed)"
                break
              fi
              if (( SECONDS >= deadline )); then
                echo "No successful $workflow run for $RELEASE_TAG on $commit"
                exit 1
              fi
              sleep 30
            done
          done
          printf 'version=%s\nchannel=%s\n' "$version" "$channel" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-fund --no-audit
      - name: Verify the Ed25519 signature and package the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          bash scripts/npm-pack.sh "$RELEASE_TAG"
          mv ".artifacts/npm/$VERSION" "$RUNNER_TEMP/npm-packages"
          python3 -B scripts/npm-publish.py "$RUNNER_TEMP/npm-packages" "$VERSION" "$CHANNEL" --verify-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release' || inputs.publish
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish through npm Trusted Publishing
    needs: prepare
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-fund --no-audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
      - name: Publish the platform packages, then the starter
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: python3 -B scripts/npm-publish.py "$RUNNER_TEMP/npm-packages" "$VERSION" "$CHANNEL"
